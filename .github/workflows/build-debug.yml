name: Build debug APK (no secrets needed)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore binary assets (stored base64-encoded for transport)
        run: |
          find . -name '*.b64' -print0 | while IFS= read -r -d '' f; do
            base64 -d "$f" > "${f%.b64}"
            rm "$f"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: bash gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Xreader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
